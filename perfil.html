<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Conta - VORA 313</title>
    <link rel="icon" type="image/png" href="logo-vora-313.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=40" />
    <link rel="manifest" href="manifest.json" />

    <!-- ✅ NOVO ESTILO MAIS SIMPLES -->
    <style>
        .perfil-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 16px;
        }
        .perfil-header {
            background: linear-gradient(135deg, var(--cor-esmeralda), var(--cor-esmeralda-escuro));
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid var(--cor-ouro);
            text-align: center;
        }
        .perfil-header h1 {
            font-size: 24px;
            color: var(--cor-ouro);
            margin-bottom: 4px;
        }
        .perfil-header p {
            font-size: 13px;
            margin: 2px 0;
            opacity: 0.9;
        }
        
        /* ✅ CARTÕES MAIS COMPACTOS */
        .perfil-card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
            margin-bottom: 16px;
        }
        .perfil-card h2 {
            font-size: 16px;
            color: var(--cor-esmeralda);
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* ✅ Estilo para cada item (pedido, favorito, cupom) */
        .pedido-item {
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .pedido-item strong {
            color: var(--cor-esmeralda);
        }
        .pedido-item small {
            color: #888;
            display: block;
            margin-top: 2px;
        }
        .favorito-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        .favorito-item img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
        }
        .favorito-item a {
            flex: 1;
            color: #333;
            text-decoration: none;
            font-weight: 600;
        }
        .favorito-item button {
            background: #fde8e8;
            border: none;
            color: #E74C3C;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        
        /* ✅ Pontos e Cupons mais compactos */
        .pontos-box {
            text-align: center;
            padding: 10px;
        }
        .pontos-grande {
            font-size: 40px;
            color: var(--cor-ouro);
            font-weight: 700;
        }
        .btn-perfil {
            background: var(--cor-ouro);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
        }
        
        /* ✅ Grid: 2 colunas no desktop, 1 no mobile */
        .perfil-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 768px) {
            .perfil-grid { grid-template-columns: 1fr; }
            .perfil-header { padding: 16px; }
            .perfil-header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <!-- HEADER (mantido igual ao que já tens) -->
    <header class="header-principal" role="banner">
        <!-- ... (copia o teu header atual) ... -->
    </header>

    <!-- CONTEÚDO DO PERFIL -->
    <div class="perfil-container">
        <div class="perfil-header">
            <h1>👤 Minha Conta</h1>
            <p id="perfilNome">Bem-vindo, Cliente!</p>
            <p id="perfilEmail"></p>
        </div>

        <div class="perfil-grid">
            <!-- Histórico de Pedidos -->
            <div class="perfil-card">
                <h2>📦 Meus Pedidos</h2>
                <div id="historicoPedidos" style="max-height:200px; overflow-y:auto;">
                    <p style="color:#999; text-align:center; padding:10px;">Nenhum pedido.</p>
                </div>
            </div>

            <!-- Lista de Desejos -->
            <div class="perfil-card">
                <h2>❤️ Lista de Desejos</h2>
                <div id="listaDesejos" style="max-height:200px; overflow-y:auto;">
                    <p style="color:#999; text-align:center; padding:10px;">Nenhum favorito.</p>
                </div>
            </div>

            <!-- Pontos Fidelidade -->
            <div class="perfil-card">
                <h2>⭐ Meus Pontos</h2>
                <div class="pontos-box">
                    <div class="pontos-grande" id="pontosFidelidade">0</div>
                    <p style="font-size:13px; color:#888;">Pontos acumulados</p>
                    <button id="btnResgatarPontos" class="btn-perfil">🎁 Resgatar Cupom</button>
                </div>
            </div>

            <!-- Cupons -->
            <div class="perfil-card">
                <h2>🎟️ Meus Cupons</h2>
                <div id="listaCupons" style="max-height:200px; overflow-y:auto;">
                    <p style="color:#999; text-align:center; padding:10px;">Nenhum cupom.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- RODAPÉ (mantido igual) -->
    <!-- ... -->

    <!-- SCRIPTS (mantidos iguais) -->
    <script type="module" src="js/perfil.js"></script>
    <script type="module" src="js/app.js?v=5"></script>
    <script type="module" src="js/carrinho.js?v=7"></script>
    <script type="module" src="js/fidelidade.js?v=5"></script>
    <script type="module" src="js/menu.js?v=5"></script>
    <script type="module" src="js/favoritos.js?v=5"></script>
</body>
</html>
