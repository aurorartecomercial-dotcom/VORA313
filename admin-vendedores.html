<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#005a4c">
<title>VORA 313 — Gestão de Vendedores</title>
<style>
:root{--green:#005a4c;--gold:#e5bd35;--bg:#f4f7f8;--text:#17202a;--muted:#667085;--line:#e6e8ec;--red:#b42318;--orange:#b54708}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.wrap{max-width:1250px;margin:32px auto;padding:20px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #00000012}.login{max-width:440px;margin:80px auto}.field{display:block;width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:10px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:#222;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.success{background:#087f5b}.btn.danger{background:#b42318}.btn.warning{background:#b54708}.btn.secondary{background:#475467}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.filters{display:grid;grid-template-columns:1fr 190px auto;gap:10px;margin:18px 0}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.kpi{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fbfcfc}.kpi span{display:block;color:var(--muted);font-size:13px}.kpi strong{display:block;font-size:25px;margin-top:5px}.seller-card{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}.seller-main{min-width:0}.seller-title{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.seller-store{font-size:15px;margin:8px 0}.muted,.meta{color:var(--muted);font-size:14px;margin-top:5px}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.empty{padding:35px;text-align:center;color:#777}.erro{color:var(--red);margin-top:10px}.msg{min-height:20px;margin:12px 0;color:#087f5b}.msg-error{color:var(--red)}.link{display:inline-block;margin-top:16px;color:#222}.status{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:bold}.status-pendente{background:#fff3cd;color:#7a5b00}.status-aprovado{background:#dff7e9;color:#086a4f}.status-suspenso{background:#fee4e2;color:#912018}.status-recusado{background:#f2f4f7;color:#475467}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-box{background:#fff;border-radius:18px;max-width:800px;width:100%;max-height:90vh;overflow:auto;padding:24px}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.detail-grid>div{border:1px solid var(--line);border-radius:12px;padding:12px}.detail-grid span,.detail-description span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.detail-description{border:1px solid var(--line);border-radius:12px;padding:12px}.detail-description p{white-space:pre-wrap;margin:0}.modal-actions{display:flex;gap:10px;align-items:center;margin-top:20px}.modal-actions select{padding:10px;border:1px solid #ddd;border-radius:9px;flex:1}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.seller-card{flex-direction:column}.actions{justify-content:flex-start}.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<section id="loginVendedores" class="card login">
<h1>🏪 Gestão de vendedores</h1><p>Acesso restrito ao administrador.</p>
<input id="emailVendedores" class="field" type="email" placeholder="Email" autocomplete="username">
<input id="senhaVendedores" class="field" type="password" placeholder="Palavra-passe" autocomplete="current-password">
<button id="btnLoginVendedores" class="btn">Entrar</button><div id="erroLoginVendedores" class="erro"></div>
<a class="link" href="admin.html">← Voltar ao Admin</a>
</section>

<section id="painelVendedores" class="card" style="display:none">
<div class="top"><div><h1>🏪 Vendedores</h1><p><span id="contadorVendedores">0</span> vendedor(es) encontrados.</p></div><div class="actions"><button id="btnAtualizarVendedores" class="btn secondary">↻ Atualizar</button><button id="btnSairVendedores" class="btn">Sair</button></div></div>
<div class="kpis">
<div class="kpi"><span>Total</span><strong id="totalVendedores">0</strong></div>
<div class="kpi"><span>Pendentes</span><strong id="totalPendentes">0</strong></div>
<div class="kpi"><span>Aprovados</span><strong id="totalAprovados">0</strong></div>
<div class="kpi"><span>Suspensos</span><strong id="totalSuspensos">0</strong></div>
<div class="kpi"><span>Recusados</span><strong id="totalRecusados">0</strong></div>
</div>
<div class="filters"><input id="filtroVendedores" class="field" type="search" placeholder="Pesquisar vendedor, loja, email, telefone ou categoria..."><select id="filtroStatusVendedores" class="field"><option value="todos">Todos os estados</option><option value="pendente">Pendentes</option><option value="aprovado">Aprovados</option><option value="suspenso">Suspensos</option><option value="recusado">Recusados</option></select></div>
<div id="mensagemVendedores" class="msg"></div><div id="listaVendedores"></div>
</section>
</main>

<div id="modalVendedor" class="modal"><div class="modal-box"><div class="modal-head"><h2>Detalhes do vendedor</h2><button id="btnFecharDetalhes" class="btn">Fechar</button></div><div id="detalhesVendedor"></div><div class="modal-actions"><select id="selectPlanoVendedor"><option value="basico">Plano Básico</option><option value="profissional">Plano Profissional</option><option value="premium">Plano Premium</option></select><button id="btnGuardarPlano" class="btn success">Guardar plano</button></div></div></div>
<script type="module" src="js/admin-vendedores.js?v=2"></script>
</body>
</html>
