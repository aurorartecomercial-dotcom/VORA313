<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VORA 313 — Vendedores</title><style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#17202a}.wrap{max-width:1100px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 30px #00000012}h1{margin-top:0}.login{max-width:420px;margin:80px auto}.field{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:10px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:#222;color:#fff}.btn.success{background:#087f5b}.btn.danger{background:#b42318}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.seller-card{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid #eee}.muted,.meta{color:#667085;font-size:14px;margin-top:5px}.actions{display:flex;align-items:center}.empty{padding:30px;text-align:center;color:#777}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.kpi{background:#f8fafb;border:1px solid #e5e7eb;border-radius:12px;padding:14px}.kpi strong{display:block;font-size:20px}.kpi span{font-size:12px;color:#667085}@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}.erro{color:#b42318;margin-top:10px}.msg{margin:12px 0;color:#087f5b}.link{display:inline-block;margin-top:16px;color:#222}
</style></head><body><main class="wrap"><section id="loginVendedores" class="card login"><h1>🏪 Gestão de vendedores</h1><p>Acesso restrito ao administrador.</p><input id="emailVendedores" class="field" type="email" placeholder="Email" autocomplete="username"><input id="senhaVendedores" class="field" type="password" placeholder="Palavra-passe" autocomplete="current-password"><button id="btnLoginVendedores" class="btn">Entrar</button><div id="erroLoginVendedores" class="erro"></div><a class="link" href="admin.html">← Voltar ao Admin</a></section><section id="painelVendedores" class="card" style="display:none"><div class="top"><div><h1>🏪 Vendedores</h1><p><span id="contadorVendedores">0</span> vendedor(es) listado(s).</p></div><button id="btnSairVendedores" class="btn">Sair</button></div><input id="filtroVendedores" class="field" type="search" placeholder="Pesquisar vendedor, loja ou email..."><div id="resumoVendedores" class="kpis"></div><div id="mensagemVendedores" class="msg"></div><div id="listaVendedores"></div></section></main><script type="module" src="js/admin-vendedores.js?v=20260923-03"></script></body></html>
