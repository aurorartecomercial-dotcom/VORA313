<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loja — VORA 313</title><link rel="stylesheet" href="style.css"><style>.loja{max-width:1180px;margin:auto;padding:25px 16px}.loja-head{background:linear-gradient(135deg,#075946,#003d32);color:#fff;border-radius:20px;padding:26px;margin-bottom:18px}.loja-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.loja-empty{background:#fff;border:1px solid #e2ebe7;border-radius:15px;padding:35px;text-align:center;color:#777}@media(max-width:900px){.loja-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.loja-grid{grid-template-columns:repeat(2,1fr)}.loja{padding:15px 8px}}</style></head><body><main class="loja"><a href="index.html">← Voltar</a><section class="loja-head"><h1 id="nome">Loja VORA 313</h1><p id="desc">Produtos publicados por este vendedor.</p><span id="estado"></span></section><div id="produtos" class="loja-grid"><div class="loja-empty">A carregar produtos...</div></div></main><script type="module">import {db} from './js/config.js';import {collection,getDocs,getDoc,doc,query,where} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';import {criarCardProduto} from './js/catalogo.js';const id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);async function run(){if(!id){$('produtos').innerHTML='<div class="loja-empty">Loja não encontrada.</div>';return}try{const v=await getDoc(doc(db,'vendedores',id));if(!v.exists()||v.data().status!=='aprovado'||v.data().ativo===false){$('produtos').innerHTML='<div class="loja-empty">Esta loja não está disponível.</div>';return}const d=v.data();$('nome').textContent=d.nomeLoja||d.nome||'Loja';$('desc').textContent=d.descricao||'Produtos publicados na VORA 313.';const s=await getDocs(query(collection(db,'produtos'),where('vendedorId','==',id),where('ativo','==',true)));const box=$('produtos');box.innerHTML='';s.docs.forEach(x=>{const c=criarCardProduto({id:x.id,...x.data()});if(c)box.append(c)});if(!box.children.length)box.innerHTML='<div class="loja-empty">Esta loja ainda não tem produtos publicados.</div>'}catch(e){console.error(e);$('produtos').innerHTML='<div class="loja-empty">Não foi possível carregar a loja.</div>'}}run();</script></body></html>
